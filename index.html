const repertoire={"piece":[["Chopin • Prelúdio Op. 28 nº 4","Mapa da obra","Toque a obra em andamento confortável, ou apenas o que já conhece. Marque dois trechos difíceis e uma frase que precisa de melhor sonoridade. Escolha um trecho de 2–4 compassos (o stretto é opcional).","Identificar dois desafios e praticar um deles com objetivo claro."],["Chopin • Prelúdio Op. 28 nº 4","Melodia e acompanhamento","Escolha uma frase de 4–8 compassos. Cante a melodia, toque os acordes em piano e junte as mãos. Isole uma passagem difícil, se necessário.","Duas execuções com melodia clara e pulso estável."],["Chopin • Prelúdio Op. 28 nº 4","Transições e interpretação","Escolha a seção mais difícil da peça, inclusive o stretto se desejar. Pratique pequenos grupos e conecte a seção ao trecho anterior e posterior; sem aceleração forçada.","Duas conexões contínuas e relaxadas."],["Chopin • Prelúdio Op. 28 nº 4","Revisão da obra","Toque a peça em andamento confortável, grave se possível e escolha um ponto para corrigir. Trabalhe a direção das frases e o pedal.","Uma execução contínua ou de uma seção extensa, com melhoria audível."],["Chopin • Valsa em Lá menor B. 150","Primeira frase","Leia 2–4 compassos; treine o baixo e os acordes separadamente, depois acrescente a melodia.","Três repetições com pulsação ternária."],["Chopin • Valsa em Lá menor B. 150","Saltos e conexão","Avance para a frase seguinte. Pratique os deslocamentos da mão esquerda sem forçar e conecte os trechos.","Três conexões estáveis."],["Chopin • Valsa em Lá menor B. 150","Desenvolvimento e revisão","Escolha a próxima frase ainda não aprendida. Fixe o dedilhado e revise a seção anterior. Repita conforme necessário antes de avançar.","Duas frases conectadas com pulso e melodia claros."],["Chopin • Prelúdio Op. 28 nº 6","Melodia na mão esquerda","Estude 2–4 compassos, destacando a linha grave e suavizando o acompanhamento na direita.","Duas execuções com melodia esquerda audível."],["Chopin • Prelúdio Op. 28 nº 6","Fraseado e continuidade","Estude uma nova frase e conecte à anterior. Observe o equilíbrio e o pedal.","Duas frases conectadas sem perder a linha melódica."]],"pieceBach":[["Petzold • Minueto em Sol menor BWV Anh. 115","Duas mãos e pulso","Leia os primeiros 4 compassos; observe dedilhado e articulação. Mãos separadas e depois juntas em grupos curtos.","Três repetições com pulso regular."],["Petzold • Minueto em Sol menor BWV Anh. 115","Frases e articulação","Avance 4 compassos e conecte com a frase anterior. Compare legato e notas destacadas conforme a edição.","Duas frases conectadas com clareza."],["Bach • Prelúdio em Dó maior BWV 846","Acordes e padrões","Escolha 4–8 compassos. Toque os acordes em bloco, depois como escritos; ouça o baixo e mantenha regularidade.","Três repetições sem acentos involuntários."],["Bach • Prelúdio em Dó menor BWV 999","Padrões de arpejo","Leia os primeiros compassos, identifique posições de acorde e pratique lentamente cada mudança.","Três repetições uniformes e relaxadas."],["Bach • Prelúdio em Dó menor BWV 999","Transições","Estude a frase seguinte e conecte as mudanças de posição. Revise o primeiro trecho sem pedal.","Duas frases ligadas e com pulso constante."],["Bach • Invenção nº 1 BWV 772","Introdução às duas vozes","Leia um motivo de 1–2 compassos em cada voz, cante cada linha e depois combine lentamente. Se for difícil, volte a uma frase do minueto.","Duas repetições em que ambas as vozes são audíveis."],["Bach • Invenção nº 1 BWV 772","Motivos e contraponto","Trabalhe a próxima entrada do motivo e conecte os trechos. Observe a articulação de cada voz.","Duas conexões claras e sem tensão."]],"pieceClassic":[["Beethoven • Ecossaise em Mi♭ maior WoO 86","Ritmo e articulação","Leia 2–4 compassos, conte os tempos, defina dedilhado e pratique as duas mãos lentamente.","Três execuções com pulso regular e articulação clara."],["Beethoven • Ecossaise em Mi♭ maior WoO 86","Frases e contraste","Avance para a próxima frase e conecte com function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function daykey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseDay(s){return new Date(s+'T12:00:00')}function addDay(s,n=1){const d=parseDay(s);d.setDate(d.getDate()+n);return daykey(d)}function fmt(s,opts={day:'2-digit',month:'short'}){return parseDay(s).toLocaleDateString('pt-BR',opts)}function copy(x){return JSON.parse(JSON.stringify(x))}function valid(s){return s&&s.version===2&&s.prefs&&[10,25,35,45].includes(s.prefs.minutes)&&Array.isArray(s.prefs.days)&&s.prefs.days.length&&s.prefs.days.length<=7&&s.prefs.days.every(d=>Number.isInteger(d)&&d>=0&&d<=6)&&Array.isArray(s.history)&&s.history.every(h=>h&&typeof h.date==='string'&&Array.isArray(h.tasks)&&h.before&&ids.every(k=>h.before[k]&&Number.isInteger(h.before[k].level)))&&ids.every(k=>s.skills?.[k]&&Number.isInteger(s.skills[k].level)&&s.skills[k].level>=0&&s.skills[k].level<=caps[k]&&Number.isFinite(s.skills[k].bpm)&&s.skills[k].bpm>=30&&s.skills[k].bpm<=180)&&s.draft&&typeof s.draft==='object'}

const clavierTracks={};
function clavierWav(events,duration){
 const rate=24000,count=Math.max(1,Math.ceil(duration*rate)),mix=new Float32Array(count);
 for(const event of events){
  const start=Math.max(0,Math.round(event.at*rate)),len=Math.max(1,Math.round(event.dur*rate)),freq=440*Math.pow(2,(event.midi-69)/12);
  for(let i=0;i<len&&start+i<count;i++){
   const t=i/rate,a=Math.min(1,t/(event.click?.004:.012)),release=Math.min(1,(len-i)/(rate*(event.click?.025:.07))),env=a*release;
   const wave=event.click?Math.sin(2*Math.PI*freq*t):Math.sin(2*Math.PI*freq*t)*.82+Math.sin(4*Math.PI*freq*t)*.13+Math.sin(6*Math.PI*freq*t)*.05;
   mix[start+i]+=wave*env*(event.vol??.42);
  }
 }
 const buffer=new ArrayBuffer(44+count*2),v=new DataView(buffer),tag=(at,str)=>{for(let i=0;i<str.length;i++)v.setUint8(at+i,str.charCodeAt(i))};
 tag(0,'RIFF');v.setUint32(4,36+count*2,true);tag(8,'WAVE');tag(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);tag(36,'data');v.setUint32(40,count*2,true);
 for(let i=0;i<count;i++)v.setInt16(44+i*2,Math.round(Math.max(-.95,Math.min(.95,mix[i]))*32767),true);
 return buffer;
}
function clavierStop(channel){
 const old=clavierTracks[channel];if(!old)return;
 old.token++;if(old.player){old.player.onended=null;old.player.onerror=null;try{old.player.pause();old.player.removeAttribute('src');old.player.load()}catch(e){}}
 if(old.url){try{URL.revokeObjectURL(old.url)}catch(e){}old.url=null}
}
function clavierAudioError(err){toast('Não consegui reproduzir o som. Toque em Testar áudio, confira o volume de mídia e a saída Bluetooth.');}
function clavierPlay(channel,events,duration,{loop=false,onEnd=null,onError=null}={}){
 try{
  if(navigator.audioSession)navigator.audioSession.type='playback';
 }catch(e){}
 const track=clavierTracks[channel]??={token:0,player:null,url:null};
 clavierStop(channel);
 const tok=++track.token;
 try{
  const player=track.player??=new Audio();player.preload='auto';player.playsInline=true;player.muted=false;player.volume=1;player.loop=loop;
  track.url=URL.createObjectURL(new Blob([clavierWav(events,duration)],{type:'audio/wav'}));player.src=track.url;
  const fail=e=>{if(track.token!==tok)return;clavierStop(channel);clavierAudioError(e);if(onError)onError(e)};
  player.onended=()=>{if(track.token===tok){clavierStop(channel);if(onEnd)onEnd()}};
  player.onerror=fail;
  // Crucial for Safari: invoke play immediately in the user's click, never after an await.
  const pending=player.play();
  return Promise.resolve(pending).then(()=>track.token===tok?player:null).catch(e=>{fail(e);return null});
 }catch(e){clavierStop(channel);clavierAudioError(e);if(onError)onError(e);return Promise.resolve(null)}
}

 function sightHtml(){if(!phrase)genPhrase();let count=flatPhrase().length;return `<div class="card"><h3>Leitura de 4 compassos</h3><p>Exercício original gerado localmente. Observe a pauta antes de ouvir. Identifique cada nota em sequência; depois toque a frase no piano respeitando as durações.</p><div class="vrow"><button data-studio6="clef">${readClef==='bass'?'Clave de Fá':'Clave de Sol'} ↔</button><button data-studio6="level">Nível ${readLevel} ↔</button><button data-studio6="new-phrase">Nova frase</button><button data-studio6="hear-phrase">♫ Ouvir frase</button></div>${phrase.map(staff6).join('')}<div class="six-notes">${noteNames.map((n,i)=>`<button data-studio6="read-note" data-value="${i}" ${phraseDone?'disabled':''}>${n}</button>`).join('')}</div><p role="status">${phraseDone?'Leitura concluída: '+(count-phraseMissed.size)+'/'+count+' notas corretas na primeira tentativa.':phraseAt+'/'+count+' notas · '+phraseErrors+' erro(s)'}</p><p class="notice">Avalia reconhecimento da sequência de notas, não precisão da execução física nem duração tocada. Para ritmo, use o laboratório.</p></div>`}
 function pieceHtml(){let a=piecesList();return `<div class="card"><h3>Caderno por obra</h3><p>Selecione uma peça e divida-a em pequenos trechos. Marque um trecho como prioridade para incluí-lo quando essa obra aparecer nos 15 treinos.</p><select id="sixPiece">${a.map(n=>`<option value="${esc(n)}" ${n===piece?'selected':''}>${esc(n)}</option>`).join('')}</select><div class="vrow"><input id="sixNewPiece" maxlength="120" placeholder="Outra obra (nome e compositor)"><button data-studio6="new-piece">Adicionar obra</button></div><div class="vrow"><input id="sixRange" maxlength="40" placeholder="Compassos, ex.: 9–12"><input id="sixIssue" maxlength="160" placeholder="Dificuldade (opcional)"><button class="primary" data-studio6="section-add">Adicionar trecho</button></div></div>${sections().map(x=>`<div class="card"><div class="between"><h3>Compassos ${esc(x.range)}</h3><span class="pill">${esc(stageNames[x.stage]||'Mapeado')}</span></div><p>${esc(x.issue||'Sem dificuldade registrada')}</p><div class="bar"><span style="width:${(x.stage+1)*20}%"></span></div><div class="vrow"><button data-studio6="section-step" data-key="${esc(x.key)}" data-delta="-1" ${x.stage<1?'disabled':''}>← Etapa</button><button data-studio6="section-step" data-key="${esc(x.key)}" data-delta="1" ${x.stage>=4?'disabled':''}>Avançar →</button><button data-studio6="section-focus" data-key="${esc(x.key)}" class="${x.focus?'selected':''}">${x.focus?'Prioritário':'Priorizar'}</button><button data-studio6="section-remove" data-key="${esc(x.key)}" class="ghost danger">Excluir</button></div></div>`).join('')}`}
 function recordHtml(){return `<div class="card"><h3>Escute sua própria interpretação</h3><p>Grave um trecho curto e compare pulso, qualidade sonora, equilíbrio entre mãos e fraseado. O áudio não será enviado a nenhum servidor.</p><div class="vrow"><button class="primary" data-studio6="record-start" ${recording?'disabled':''}>● Gravar</button><button data-studio6="record-stop" ${!recording?'disabled':''}>■ Parar</button></div>${recording?'<p role="status">Gravação em andamento…</p>':''}${recError?`<p class="danger">${esc(recError)}</p>`:''}${recordURL?`<audio controls playsinline src="${esc(recordURL)}" style="width:100%"></audio><p><a href="${esc(recordURL)}" download="clavier-gravacao.${recordBlob?.type?.includes('mp4')?'m4a':'webm'}">Salvar gravação</a></p>`:''}<p class="notice">Você precisa permitir o microfone. A gravação fica apenas nesta sessão do aplicativo; salve o arquivo antes de atualizar ou fechar. Não há análise automática por IA.</p></div>`}
 async function beginRecord(){if(recording)return;try{clavierStop('studio6');stopMetro();if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Gravação não suportada. Use o Gravador do iPhone e salve o áudio.');stream=await navigator.mediaDevices.getUserMedia({audio:true});if(view!=='studio6'||tab!=='record'){stream.getTracks().forEach(t=>t.stop());stream=null;return}const R=window.MediaRecorder,chunks=[];recorder=new R(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(recordURL)URL.revokeObjectURL(recordURL);recordBlob=new Blob(chunks,{type:recorder.mimeType||chunks[0]?.type||'audio/webm'});recordURL=URL.createObjectURL(recordBlob);stream?.getTracks().forEach(t=>t.stop());stream=null;recording=false;render()};recorder.onerror=()=>{recError='Erro na gravação.';endRecord()};recorder.start();recording=true;recError='';render()}catch(e){stream?.getTracks().forEach(t=>t.stop());stream=null;recError=e.message||'Permita o acesso ao microfone.';recording=false;render()}}
 function endRecord(){if(recorder&&recorder.state!=='inactive')recorder.stop();else{stream?.getTracks().forEach(t=>t.stop());stream=null;recording=false}}

 render=function(){if(view!=='studio6')return priorRender();document.body.classList.toggle('dark',state.prefs.dark);renderNav();document.getElementById('main').innerHTML=studioPage()};
 document.addEventListener('change',e=>{let x=e.target;if(x.id==='sixPiece'){piece=x.value;render()}if(x.id==='scaleRoot6'){selectedScale=Number(x.value);scaleTry=null;render()}if(x.id==='scaleType6'){scaleMode=x.value;scaleTry=null;render()}if(x.id==='sixGoal'){state.prefs.weekGoal=Number(x.value);save();render()}});
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav&&view==='studio6'&&d.nav!=='studio6'){clavierStop('studio6');if(recording)endRecord()}if(!d.studio6)return;e.preventDefault();e.stopImmediatePropagation();switch(d.studio6){
 case 'open':view='studio6';render();window.scrollTo(0,0);break;

 case 'new-piece':{const name=cut(document.getElementById('sixNewPiece')?.value,120);if(!name)return toast('Informe o nome da obra.');if(['__proto__','constructor','prototype'].includes(name))return toast('Nome inválido.');piece=name;if(!Object.hasOwn(state.workbook6||{},name))persistSection([]);render();break}
 case 'section-add':{let range=cut(document.getElementById('sixRange')?.value,40),issue=cut(document.getElementById('sixIssue')?.value,160);if(!range)return toast('Informe o intervalo de compassos.');persistSection([...sections(),{key:'s'+Date.now(),range,issue,stage:0,focus:false}]);render();break}
 case 'section-step':case 'section-focus':case 'section-remove':{let a=sections().map(x=>({...x})),i=a.findIndex(x=>x.key===d.key);if(i<0)break;if(d.studio6==='section-remove'){if(!confirm('Excluir este trecho do caderno?'))break;a.splice(i,1)}else if(d.studio6==='section-step')a[i].stage=Math.max(0,Math.min(4,a[i].stage+Number(d.delta)));else{const old=a[i].focus;a.forEach(x=>x.focus=false);a[i].focus=!old}persistSection(a);render();break}
 case 'scale-dir':scaleDirection=scaleDirection==='up'?'down':'up';scaleTry=null;render();break;
 case 'scale-start':scaleTry={notes:scaleData(),root:selectedScale,type:scaleMode,direction:scaleDirection,pos:0,errors:0,missed:new Set(),done:false,hint:false};render();break;
 case 'scale-note':scaleInput(Number(d.value),true);break;
 case 'scale-hint':if(scaleTry&&!scaleTry.done){scaleTry.hint=true;scaleTry.missed.add(scaleTry.pos);render()}break;
 case 'scale-end':scaleTry=null;clavierStop('studio6');render();break;
 case 'scale-play':{let a=scaleData();clavierPlay('studio6',a.map((x,i)=>({at:i*.48,midi:x.midi,dur:.4,vol:.5})),a.length*.48);break}
 case 'scale-chord':{let root=60+roots[selectedScale][1],third=scaleMode==='major'?4:3;clavierPlay('studio6',[0,third,7].map(n=>({at:0,midi:root+n,dur:.8,vol:.18})),.9);break}
 case 'clef':readClef=readClef==='bass'?'treble':'bass';genPhrase();render();break;
 case 'level':readLevel=readLevel===1?2:1;genPhrase();render();break;
 case 'new-phrase':genPhrase();render();break;
 case 'hear-phrase':{let t=0,a=flatPhrase().map(n=>{let event={at:t,midi:n.midi,dur:.48*n.dur,vol:.5};t+=.6*n.dur;return event});clavierPlay('studio6',a,t+.1);break}
 case 'read-note':{if(phraseDone)break;let n=flatPhrase()[phraseAt];if(!n)break;if((n.d%7+7)%7===Number(d.value)){phraseAt++;if(phraseAt>=flatPhrase().length){phraseDone=true;state.sight6??=[];state.sight6.push({date:daykey(),total:flatPhrase().length,errors:phraseErrors,firstCorrect:flatPhrase().length-phraseMissed.size,clef:readClef});save()}}else{phraseErrors++;phraseMissed.add(phraseAt);toast('Tente novamente. Observe a linha ou o espaço.')}render();break}
 case 'record-start':beginRecord();break;case 'record-stop':endRecord();break;

render=function(){oldVersionRender();const nav=document.getElementById('main');if(nav){if(freePiece)nav.insertAdjacentHTML('afterbegin',freePieceHtml());if(view==='today'){const works=plan()[0].tasks.filter(t=>t.subtitle&&bundledScores[t.subtitle]);nav.insertAdjacentHTML('afterbegin','<div class="card" style="border:2px solid var(--accent)"><h3>Avaliação MIDI de partitura</h3>'+(works.length?works.map(t=>'<p><b>'+esc(t.subtitle)+'</b></p>'+scorePanel(t)+'<button class="primary" data-timer="'+esc(t.id)+'" data-min="'+t.min+'">'+(activeTimer===t.id?'Pausar avaliação':'Iniciar prática MIDI')+'</button>').join(''):'<p>Nenhuma obra com partitura integrada no roteiro atual. As partituras aparecem quando a obra correspondente estiver programada.</p>')+'</div>')}nav.insertAdjacentHTML('beforeend','<input type="file" id="scoreFile7" accept=".xml,.musicxml" style="display:none">');if(rangeTask){const q=state.scoreLibrary7[scoreKey(rangeTask)];nav.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;z-index:10000;background:#0009;display:grid;place-items:center;padding:20px"><div class="card"><h3>Selecionar compassos</h3><p>'+esc(q.title)+' · '+q.measures+' compassos</p><label>Inicial <input id="scoreFrom7" type="number" min="1" value="'+q.from+'"></label><label>Final <input id="scoreTo7" type="number" min="1" value="'+q.to+'"></label><button data-score-range-apply="1">Salvar trecho</button><button data-score-range-cancel="1">Cancelar</button></div></div>')}if(practiceMidi)nav.insertAdjacentHTML('afterbegin','<div class="card notice">MIDI: '+(midiConnected?'conectado':'aguardando conexão')+' · <span id="practiceMidiCount">'+practiceMidi.count+' notas</span></div>');if(practicePending)nav.insertAdjacentHTML('beforeend', '<div style="position:fixed;inset:0;z-index:9999;background:#0009;display:flex;justify-content:center;align-items:center;padding:20px"><div class="card" role="dialog" aria-modal="true" style="width:100%;max-width:420px"><h3>Ativar metrônomo?</h3><p>'+esc(practicePending.title)+' · '+practicePending.bpm+' BPM</p><p class="notice">O MIDI será monitorado durante a prática, se conectado.</p><button class="primary" data-practice-choice="yes">Sim, ativar metrônomo</button><button data-practice-choice="no">Não, somente cronômetro</button><button data-practice-choice="cancel">Cancelar</button></div></div>');nav.insertAdjacentHTML('beforeend','<div class="card" style="margin-top:16px"><div class="between"><small>Clavier · versão 7.2.1</small><button data-audio-test="1">♪ Testar áudio</button></div><button data-refresh-app="1" class="inlinebtn">Verificar atualização</button><p class="notice">O histórico fica salvo neste dispositivo.</p></div>')}};
document.addEventListener('click',e=>{const b=e.target.closest('button[data-refresh-app]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if('serviceWorker'in navigator)navigator.serviceWorker.getRegistration().then(r=>r?.update()).catch(()=>{});const u=new URL(location.href);u.searchParams.set('v','7.2.1-'+Date.now());location.replace(u.href)},true);
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
 let refreshing=false;const controlled=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(controlled&&!refreshing){refreshing=true;location.reload()}});
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
}
</script></body></html>
