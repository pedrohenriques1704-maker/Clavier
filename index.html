const repertoire={"piece":[["Chopin • Prelúdio Op. 28 nº 4","Mapa da obra","Toque a obra em andamento confortável, ou apenas o que já conhece. Marque dois trechos difíceis e uma frase que precisa de melhor sonoridade. Escolha um trecho de 2–4 compassos (o stretto é opcional).","Identificar dois desafios e praticar um deles com objetivo claro."],["Chopin • Prelúdio Op. 28 nº 4","Melodia e acompanhamento","Escolha uma frase de 4–8 compassos. Cante a melodia, toque os acordes em piano e junte as mãos. Isole uma passagem difícil, se necessário.","Duas execuções com melodia clara e pulso estável."],["Chopin • Prelúdio Op. 28 nº 4","Transições e interpretação","Escolha a seção mais difícil da peça, inclusive o stretto se desejar. Pratique pequenos grupos e conecte a seção ao trecho anterior e posterior; sem aceleração forçada.","Duas conexões contínuas e relaxadas."],["Chopin • Prelúdio Op. 28 nº 4","Revisão da obra","Toque a peça em andamento confortável, grave se possível e escolha um ponto para corrigir. Trabalhe a direção das frases e o pedal.","Uma execução contínua ou de uma seção extensa, com melhoria audível."],["Chopin • Valsa em Lá menor B. 150","Primeira frase","Leia 2–4 compassos; treine o baixo e os acordes separadamente, depois acrescente a melodia.","Três repetições com pulsação ternária."],["Chopin • Valsa em Lá menor B. 150","Saltos e conexão","Avance para a frase seguinte. Pratique os deslocamentos da mão esquerda sem forçar e conecte os trechos.","Três conexões estáveis."],["Chopin • Valsa em Lá menor B. 150","Desenvolvimento e revisão","Escolha a próxima frase ainda não aprendida. Fixe o dedilhado e revise a seção anterior. Repita conforme necessário antes de avançar.","Duas frases conectadas com pulso e melodia claros."],["Chopin • Prelúdio Op. 28 nº 6","Melodia na mão esquerda","Estude 2–4 compassos, destacando a linha grave e suavizando o acompanhamento na direita.","Duas execuções com melodia esquerda audível."],["Chopin • Prelúdio Op. 28 nº 6","Fraseado e continuidade","Estude uma nova frase e conecte à anterior. Observe o equilíbrio e o pedal.","Duas frases conectadas sem perder a linha melódica."]],"pieceBach":[["Petzold • Minueto em Sol menor BWV Anh. 115","Duas mãos e pulso","Leia os primeiros 4 compassos; observe dedilhado e articulação. Mãos separadas e depois juntas em grupos curtos.","Três repetições com pulso regular."],["Petzold • Minueto em Sol menor BWV Anh. 115","Frases e articulação","Avance 4 compassos e conecte com a frase anterior. Compare legato e notas destacadas conforme a edição.","Duas frases conectadas com clareza."],["Bach • Prelúdio em Dó maior BWV 846","Acordes e padrões","Escolha 4–8 compassos. Toque os acordes em bloco, depois como escritos; ouça o baixo e mantenha regularidade.","Três repetições sem acentos involuntários."],["Bach • Prelúdio em Dó menor BWV 999","Padrões de arpejo","Leia os primeiros compassos, identifique posições de acorde e pratique lentamente cada mudança.","Três repetições uniformes e relaxadas."],["Bach • Prelúdio em Dó menor BWV 999","Transições","Estude a frase seguinte e conecte as mudanças de posição. Revise o primeiro trecho sem pedal.","Duas frases ligadas e com pulso constante."],["Bach • Invenção nº 1 BWV 772","Introdução às duas vozes","Leia um motivo de 1–2 compassos em cada voz, cante cada linha e depois combine lentamente. Se for difícil, volte a uma frase do minueto.","Duas repetições em que ambas as vozes são audíveis."],["Bach • Invenção nº 1 BWV 772","Motivos e contraponto","Trabalhe a próxima entrada do motivo e conecte os trechos. Observe a articulação de cada voz.","Duas conexões claras e sem tensão."]],"pieceClassic":[["Beethoven • Ecossaise em Mi♭ maior WoO 86","Ritmo e articulação","Leia 2–4 compassos, conte os tempos, defina dedilhado e pratique as duas mãos lentamente.","Três execuções com pulso regular e articulação clara."],["Beethoven • Ecossaise em Mi♭ maior WoO 86","Frases e contraste","Avance para a próxima frase e conecte com étodo: análise, dedos, ritmo, mãos separadas e juntas.","Uma frase executada de forma autônoma."]]}; const pieceIds=["piece","pieceBach","pieceClassic","pieceRomantic"]; const isPiece=k=>pieceIds.includes(k);

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function daykey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseDay(s){return new Date(s+'T12:00:00')}function addDay(s,n=1){const d=parseDay(s);d.setDate(d.getDate()+n);return daykey(d)}function fmt(s,opts={day:'2-digit',month:'short'}){return parseDay(s).toLocaleDateString('pt-BR',opts)}function copy(x){return JSON.parse(JSON.stringify(x))}function valid(s){return s&&s.version===2&&s.prefs&&[10,25,35,45].includes(s.prefs.minutes)&&Array.isArray(s.prefs.days)&&s.prefs.days.length&&s.prefs.days.length<=7&&s.prefs.days.every(d=>Number.isInteger(d)&&d>=0&&d<=6)&&Array.isArray(s.history)&&s.history.every(h=>h&&typeof h.date==='string'&&Array.isArray(h.tasks)&&h.before&&ids.every(k=>h.before[k]&&Number.isInteger(h.before[k].level)))&&ids.every(k=>s.skills?.[k]&&Number.isInteger(s.skills[k].level)&&s.skills[k].level>=0&&s.skills[k].level<=caps[k]&&Number.isFinite(s.skills[k].bpm)&&s.skills[k].bpm>=30&&s.skills[k].bpm<=180)&&s.draft&&typeof s.draft==='object'}

let state;let storageOK=true;try{const saved=migrate(JSON.parse(localStorage.getItem(STORAGE)));state=valid(saved)?saved:fresh()}catch(e){state=fresh();storageOK=false}let view='today';let sessionDate=state.draftDate||null;let tempMinutes=state.draftMinutes||null;let bpm=60;let metroOn=false, audioCtx=null,metroTimer=null,nextTick=0;let practiceTimer=null,remaining=0,activeTimer=null;let toastTimer;
function save(){state.draftDate=sessionDate;state.draftMinutes=tempMinutes;try{localStorage.setItem(STORAGE,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;toast('Não foi possível gravar neste navegador. Exporte um backup.')}}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),4200)}
function dates(n=15){let start=daykey();const h=state.history.at(-1);if(h&&h.date>=start)start=addDay(h.date);let d=sessionDate&&(!h||sessionDate>h.date)&&sessionDate>=daykey()?sessionDate:start;const out=[];for(let i=0;out.length<n&&i<150;i++,d=addDay(d)){if((out.length===0&&sessionDate===d)||state.prefs.days.includes(parseDay(d).getDay()))out.push(d)}return out}
function issueTip(s,k){if(!s.issue)return '';const tips={ritmo:'Subdivida o pulso em voz alta antes de tocar.',coordenacao:'Isole uma mão e junte apenas uma ou duas notas/tempos por vez.',dedilhado:'Marque um dedilhado fixo e pratique a passagem entre posições.',acordes:'Bloqueie as posições e ensaie a chegada sem tocar.',expressao:'Trabalhe uma única dinâmica; reduza o acompanhamento.',ornamento:'Retire a figura ornamental, estabilize a base e reintroduza lentamente.',leitura:'Leia as alturas e o ritmo separadamente antes de tocar.',tensao:'Reduza o andamento; pare se sentir dor. Solte ombros e punhos.',tempo:'Use o modo curto, com prioridade no trecho difícil.',outro:'Reduza o trecho e observe o motivo antes de repetir.'};return tips[s.issue]||''}
function taskFor(k,s,mins){let l=s.level, item={id:k,category:names[k],min:mins,bpm:s.bpm,level:l};let n=Math.min(l,caps[k]-1);if(k==='scale'){let t=tonalities[Math.floor(n/2)],joint=n%2===1;Object.assign(item,{title:t[0]+' · '+(joint?'mãos juntas':'mãos separadas'),desc:`Uma oitava, subindo e descendo; ${joint?'mãos juntas, uma nota por clique; revise separadamente se travar':'cada mão separadamente, uma nota por clique'}. Notas: ${t[1]}. MD: ${t[2]}; ME: ${t[3]}. Na descida, inverta. Sem pedal.`,criterion:'Três subidas e descidas sem erro, com dedos fixos e sem tensão.'})}if(k==='arp'){let t=tonalities[Math.floor(n/2)],inv=n%2===1;Object.assign(item,{title:t[0].replace(' natural','')+' · '+(inv?'inversões':'tríade e arpejo'),desc:inv?`Toque ${t[4]} nas três posições: fundamental, 1ª e 2ª inversão. Mãos separadas, uma posição por vez, sem pedal.`:`Toque a tríade ${t[4]} junta; depois uma nota por clique, até repetir a fundamental na oitava e retornar. Mãos separadas; não force a abertura.`,criterion:'Três ciclos com posições estáveis, pulso regular e punhos livres.'})}if(k==='tech'){let t=tech[n];Object.assign(item,{title:t[0],desc:t[1],criterion:t[2]})}if(k==='read'){let count=n<2?4:n<5?8:12;Object.assign(item,{title:`Leitura inédita · ${count} compassos`,desc:`Escolha ${count} compassos fáceis que ainda não conhece (Czerny Op. 599, minuetos ou outra peça simples). Observe tonalidade, ritmo e posições por 30 segundos. Toque sem retornar ao início; use mãos separadas se a leitura for difícil.`,criterion:'Mantenha o pulso até o fim. Registre os erros depois; use novo trecho no próximo treino.'})}if(isPiece(k)){let t=repertoire[k][n];Object.assign(item,{title:t[1],subtitle:t[0],desc:t[2],criterion:t[3]})}if(l>=caps[k]){if(isPiece(k)){item.title='Revisão rotativa e autonomia';item.subtitle=names[k];item.desc='Escolha uma obra já estudada nesta trilha ou uma peça inédita de dificuldade semelhante. Trabalhe uma frase nova, uma passagem difícil ou uma gravação, aplicando o método de estudo.';item.criterion='Uma frase estudada com método e uma melhoria identificada.'}else{item.title='Revisão · '+item.title;item.desc+=' Revise também uma habilidade anterior e anote a próxima meta.'}}if(s.issue&&s.last===1){item.tip=issueTip(s,k)}return item}
const times={10:{scale:3,piece:7},25:{warm:2,scale:4,arp:3,tech:3,read:3,piece:8,free:2},35:{warm:3,scale:5,arp:2,tech:5,read:5,piece:12,free:3},45:{warm:4,scale:7,arp:4,tech:7,read:5,piece:15,free:3}};
function makeTasks(sk,minutes,idx){const t=times[minutes],out=[];if(t.warm)out.push({id:'warm',category:'Preparação',title:'Aquecimento consciente',min:t.warm,desc:'Relaxe os ombros. Toque cinco notas lentas, alternando mãos, com toque natural. Sem forçar os dedos.',criterion:'Mãos e punhos livres; nenhum desconforto.'});for(const k of ids.filter(x=>!isPiece(x))){if(t[k])out.push(taskFor(k,sk[k],t[k]))}if(t.piece){const k=pieceIds[(state.history.length+idx)%pieceIds.length];out.push(taskFor(k,sk[k],t.piece))}if(t.free)out.push({id:'free',category:'Motivação',title:'Toque por prazer',min:t.free,desc:'Escolha uma peça que você gosta, como Bach, Beethoven ou Chopin. Sem obrigação de velocidade.',criterion:'Finalize a sessão com uma execução prazerosa.'});return out}
function update(sk,k,r,issue,actualBpm){const s=sk[k],old=s.level;const prevBpm=s.bpm;s.attempts++;if(r===0)return `${names[k]}: mantida (não praticada).`;s.last=r;if(r===1){s.streak=0;s.firm=0;s.issue=issue||'outro';s.bpm=Math.max(30,Math.min(s.bpm,actualBpm||s.bpm)-4);return `${names[k]}: reforço${s.bpm!==prevBpm?' a '+s.bpm+' BPM':''}.`}s.issue='';s.streak++;if(r===3)s.firm++;if(r===3&&Number.isFinite(actualBpm))s.bpm=Math.max(30,Math.min(180,actualBpm));if(s.streak>=2&&s.firm>=1&&s.level<caps[k]){s.level++;s.streak=0;s.firm=0;s.bpm=baseBpm[k];return `${names[k]}: nova etapa desbloqueada.`}if(r===3&&!isPiece(k)&&k!=='read')s.bpm=Math.min(100,s.bpm+4);return `${names[k]}: ${r===3?'consolidando':'repetição dirigida'}.`}
function plan(){let sk=copy(state.skills),ds=dates(),minutes=tempMinutes||state.prefs.minutes;return ds.map((d,i)=>{const tasks=makeTasks(sk,i===0?minutes:state.prefs.minutes,i);const row={date:d,tasks,minutes:tasks.reduce((a,t)=>a+t.min,0),n:state.history.length+i+1};for(const t of tasks)if(ids.includes(t.id)){// Conservative projection: a successful session followed by a firm session; not saved as real progress.
 const s=sk[t.id];update(sk,t.id,s.streak>0?3:2,'',s.bpm)}return row})}
function statuses(){return state.draft||{}}function getDraft(id){return statuses()[id]||{}}function setDraft(id,patch){state.draft[id]={...getDraft(id),...patch};save()}
function doneCount(tasks){return tasks.filter(t=>Number.isInteger(getDraft(t.id).score)).length}function renderNav(){const options=[['today','◷','Treino'],['plan','▤','15 dias'],['progress','↗','Evolução'],['settings','⚙','Estúdio']];document.getElementById('sideNav').innerHTML=options.map(([v,i,n])=>`<button data-nav="${v}" class="${view===v?'active':''}">${i} &nbsp; ${n}</button>`).join('');document.getElementById('footNav').innerHTML=options.map(([v,i,n])=>`<button data-nav="${v}" class="${view===v?'active':''}"><span>${i}</span>${n}</button>`).join('')}
const problems=[['ritmo','Ritmo'],['coordenacao','Coordenação'],['dedilhado','Dedilhado'],['acordes','Acordes / saltos'],['ornamento','Ornamento'],['expressao','Expressão / dinâmica'],['leitura','Leitura'],['tensao','Tensão'],['tempo','Falta de tempo'],['outro','Outro']];
function renderTask(t,i){const d=getDraft(t.id);return `<article class="card task" id="task-${t.id}"><div class="head"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="tasktitle"><div class="eyebrow">${esc(t.category)}${t.subtitle?' · '+esc(t.subtitle):''}</div><h3>${esc(t.title)}</h3><small>${t.min} min${t.bpm?' · '+t.bpm+' BPM sugeridos':''}</small></div><button class="ghost" data-timer="${t.id}" data-min="${t.min}" aria-label="Cronometrar exercício">${activeTimer===t.id?'Parar':'▷'}</button></div><p>${esc(t.desc)}</p>${t.tip?`<p class="danger"><b>Ajuste do último treino:</b> ${esc(t.tip)}</p>`:''}<div class="criteria"><b>Meta:</b> ${esc(t.criterion)}</div>${t.bpm?`<button class="inlinebtn" data-metro="${t.bpm}">Usar metrônomo a ${t.bpm} BPM</button>`:''}<div class="scores" aria-label="Avaliação de ${esc(t.title)}">${scoreNames.map((s,r)=>`<button data-id="${t.id}" data-score="${r}" aria-pressed="${d.score===r}" class="${d.score===r?'chosen':''}">${s}</button>`).join('')}</div>${d.score===1&&ids.includes(t.id)?`<div class="extra"><select data-issue="${t.id}" aria-label="Qual foi a dificuldade?"><option value="">Qual foi a dificuldade?</option>${problems.map(([a,b])=>`<option value="${a}" ${d.issue===a?'selected':''}>${b}</option>`).join('')}</select></div>`:''}${Number.isInteger(d.score)&&d.score>0&&t.bpm?`<div class="extra"><label class="notice">BPM efetivamente praticado (opcional)<input type="number" min="30" max="180" placeholder="${t.bpm}" data-bpm="${t.id}" value="${esc(d.bpm||'')}"></label></div>`:''}</article>`}
function renderToday(){const p=plan()[0],count=doneCount(p.tasks),completed=state.history.length;const focus=p.tasks.find(t=>isPiece(t.id));return `<div class="hero"><div class="eyebrow">Sessão ${String(p.n).padStart(2,'0')} · ${fmt(p.date,{weekday:'long',day:'numeric',month:'long'})}</div><h1>O piano, hoje.</h1><p>${esc(focus?.subtitle||'Fundamentos')} — ${esc(focus?.title||'Prática consciente')}. Um objetivo pequeno, progresso real.</p><div class="meta"><span class="pill">◷ ${p.minutes} minutos</span><span class="pill">${p.tasks.length} exercícios</span><span class="pill">15 sessões planejadas</span></div></div><div class="grid"><div class="metric"><small>Sessões feitas</small><strong>${completed}</strong></div><div class="metric"><small>Etapas dominadas</small><strong>${ids.reduce((a,k)=>a+state.skills[k].level,0)}</strong></div><div class="metric"><small>Hoje avaliado</small><strong id="todayCount">${count}/${p.tasks.length}</strong></div></div>${!storageOK?'<div class="card danger">Armazenamento local indisponível. Exporte backups para não perder dados.</div>':''}${p.date>daykey()?`<div class="card between"><div><b>Próximo treino: ${fmt(p.date)}</b><p class="notice">Hoje é descanso ou já houve uma sessão.</p></div>${!state.history.length||state.history.at(-1).date<daykey()?'<button data-action="train-now">Treinar hoje</button>':''}</div>`:''}${state.lastChanges?.length?`<div class="card soft"><div class="eyebrow">O plano aprendeu com você</div><p>${state.lastChanges.map(esc).join(' · ')}</p></div>`:''}<div class="card"><div class="between"><div><b>Metrônomo</b><p class="notice">Uma batida por clique · ajuste quando quiser.</p></div><div class="toolbox"><input id="metroBpm" type="number" min="30" max="180" value="${bpm}" aria-label="BPM"><button class="primary" data-action="metro-toggle" id="metroToggle">${metroOn?'Parar':'Iniciar'}</button></div></div><div class="row notice"><span id="timerLabel">${activeTimer?'Cronômetro: '+activeTimer:'Cronômetro de exercício'}</span><span class="timer" id="timerDisplay">${formatTimer(remaining)}</span>${activeTimer?'<button class="inlinebtn" data-action="timer-stop">Encerrar</button>':''}</div></div><div class="sectionhead"><h2>Seu roteiro</h2><select id="sessionMins" aria-label="Duração do treino"><option value="10" ${p.minutes===10?'selected':''}>10 min · essencial</option><option value="25" ${p.minutes===25?'selected':''}>25 min · leve</option><option value="35" ${p.minutes===35?'selected':''}>35 min · padrão</option><option value="45" ${p.minutes===45?'selected':''}>45 min · intenso</option></select></div><div class="bar"><span id="todayBar" style="width:${count/p.tasks.length*100}%"></span></div><p class="notice" style="margin-bottom:12px">Dominei = atingiu a meta indicada. Consegui = fez, mas ainda precisa consolidar. Travei = não conseguiu com controle. Não fiz = sem prática.</p>${p.tasks.map(renderTask).join('')}<div class="card"><label for="sessionNote"><b>Diário de prática</b></label><textarea id="sessionNote" placeholder="Onde travou? O que funcionou?">${esc(state.note)}</textarea></div><div class="finish"><div><b id="finishCount">${count} de ${p.tasks.length} avaliados</b><div class="notice">O próximo plano será recalculado.</div></div><button class="primary" data-action="finish" ${count===0||p.date>daykey()?'disabled':''}>Finalizar treino →</button></div>`}
function renderPlan(){const rows=plan();return `<div class="hero"><div class="eyebrow">Horizonte móvel</div><h1>Seus próximos 15 treinos.</h1><p>O primeiro é o compromisso atual. Os demais são previsões que mudam quando você registra seu desempenho. O repertório alterna quatro trilhas independentes.</p></div><div class="card"><div class="between"><b>Calendário de sessões</b><span class="pill">${state.prefs.days.length} dias/semana</span></div>${rows.map((r,i)=>`<div class="planrow"><div class="datebox"><strong>${parseDay(r.date).getDate()}</strong><small>${fmt(r.date,{month:'short'})}</small></div><div><h3>${i===0?'Próximo treino':'Sessão '+r.n} · ${fmt(r.date,{weekday:'short'})}</h3><small>${esc(r.tasks.find(t=>isPiece(t.id))?.subtitle||'Repertório')} — ${esc(r.tasks.find(t=>isPiece(t.id))?.title||'Prática')}</small><details><summary class="notice">${r.minutes} min · ver roteiro</summary>${r.tasks.map(t=>`<p><b>${esc(t.category)}:</b> ${esc(t.title)} (${t.min} min${t.bpm?', '+t.bpm+' BPM':''})</p>`).join('')}</details></div><span class="pill">${i===0?'Atual':'Previsão'}</span></div>`).join('')}</div><div class="card soft"><b>Como interpretar o calendário</b><p class="notice">Os treinos futuros simulam uma sequência de execução satisfatória e domínio. Nenhum avanço previsto é salvo automaticamente. A data pula os dias de descanso; um dia perdido não é registrado como fracasso.</p></div>`}
function renderProgress(){let scores={};for(const h of state.history)for(const t of h.tasks){if(t.score===1&&t.issue)scores[t.issue]=(scores[t.issue]||0)+1}let top=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,4);return `<div class="hero"><div class="eyebrow">Aprendizagem acumulada</div><h1>O seu progresso.</h1><p>O desenvolvimento é medido por habilidades consolidadas, não apenas por dias estudados.</p></div><div class="grid"><div class="metric"><small>Sessões</small><strong>${state.history.length}</strong></div><div class="metric"><small>Min planejados*</small><strong>${state.history.reduce((a,h)=>a+h.tasks.filter(t=>t.score>0).reduce((b,t)=>b+t.min,0),0)}</strong></div><div class="metric"><small>Etapas</small><strong>${ids.reduce((a,k)=>a+state.skills[k].level,0)}</strong></div></div><p class="notice">*Tempo previsto dos exercícios marcados como praticados, não medição real.</p><div class="sectionhead"><h2>Mapa de habilidades</h2></div>${ids.map(k=>{let s=state.skills[k],t=taskFor(k,s,1);return `<div class="card"><div class="between"><b>${names[k]}</b><span class="pill">${s.level}/${caps[k]} etapas</span></div><div class="bar"><span style="width:${s.level/caps[k]*100}%"></span></div><p>${esc(t.title)}</p><p class="notice">${s.attempts} avaliações · ${s.streak} acertos seguidos${s.issue?' · foco: '+esc(problems.find(p=>p[0]===s.issue)?.[1]||s.issue):''}</p></div>`}).join('')}<div class="sectionhead"><h2>Padrões de dificuldade</h2></div><div class="card">${top.length?top.map(([k,n])=>`<div class="between"><span>${esc(problems.find(p=>p[0]===k)?.[1]||k)}</span><b>${n} registro(s)</b></div><div class="bar"><span style="width:${n/top[0][1]*100}%"></span></div>`).join(''):'<p class="muted">As dificuldades aparecem conforme você registra os treinos.</p>'}</div><div class="sectionhead"><h2>Histórico</h2>${state.history.length?'<button data-action="undo" class="ghost">Desfazer último</button>':''}</div><div class="card">${state.history.length?state.history.slice().reverse().map(h=>`<details class="historyitem"><summary><b>${fmt(h.date)} · Sessão ${h.n}</b> <span class="chip">${h.tasks.filter(t=>t.score>0).length}/${h.tasks.length} praticados</span></summary>${h.tasks.map(t=>`<p class="notice">${t.subtitle?esc(t.subtitle)+" · ":""}${esc(t.title)} — ${scoreNames[t.score]}${t.issue?' · '+esc(problems.find(p=>p[0]===t.issue)?.[1]||t.issue):''}</p>`).join('')}${h.note?`<p>${esc(h.note)}</p>`:''}</details>`).join(''):'<p class="muted">Sua primeira sessão ainda não foi registrada.</p>'}</div>`}
function renderSettings(){return `<div class="hero"><div class="eyebrow">Ajustes e biblioteca</div><h1>Seu estúdio.</h1><p>Construa uma rotina que caiba na sua vida.</p></div><div class="card"><h3>Rotina de prática</h3><label class="label" for="prefMins">Duração padrão</label><select id="prefMins">${[10,25,35,45].map(m=>`<option value="${m}" ${state.prefs.minutes===m?'selected':''}>${m} minutos</option>`).join('')}</select><div class="label">Dias da semana</div><div class="days">${[[1,'Seg'],[2,'Ter'],[3,'Qua'],[4,'Qui'],[5,'Sex'],[6,'Sáb'],[0,'Dom']].map(([d,n])=>`<button data-day="${d}" class="${state.prefs.days.includes(d)?'active':''}" aria-pressed="${state.prefs.days.includes(d)}">${n}</button>`).join('')}</div><p class="notice">O padrão é de cinco dias de treino por semana. O horizonte sempre mostra 15 sessões, não 15 dias corridos.</p><div class="sectionhead"><b>Aparência</b><button data-action="theme">${state.prefs.dark?'Modo claro':'Modo escuro'}</button></div></div><div class="card"><h3>Repertório em rotação</h3><p>Chopin → Bach e barroco → Clássico → Romântico. Cada trilha tem seu próprio nível, andamento e dificuldades. Travar em uma obra não bloqueia as demais. O compasso 16 é apenas uma opção de reforço, nunca uma etapa obrigatória.</p><p class="notice">Ao atualizar da primeira versão, o histórico e os fundamentos são preservados; o nível de repertório reinicia devido à nova organização.</p></div><div class="card"><h3>Como funciona a evolução</h3><div class="scorelegend" style="margin-top:12px"><b>Não fiz</b><span>Preserva a etapa sem perda de progresso.</span><b>Travei</b><span>Repete a etapa, reduz 4 BPM e, se informado, orienta um ajuste específico.</span><b>Consegui</b><span>Conta como sucesso; mantém a etapa até consolidar.</span><b>Dominei</b><span>Meta atingida. Duas avaliações consecutivas de sucesso, com pelo menos um domínio, liberam a próxima etapa.</span></div><p class="notice">O plano usa regras locais, sem IA online ou análise de áudio. Você é quem avalia a execução. Se um andamento ficar desconfortável, reduza-o manualmente.</p></div><div class="card"><h3>Biblioteca de estudo</h3><p style="margin:9px 0"><a href="https://imslp.org/wiki/Preludes_Op.28_%28Chopin%2C_Frederic%29" target="_blank" rel="noopener">Chopin · Prelúdios Op. 28 (IMSLP)</a></p><p style="margin:9px 0"><a href="https://imslp.org/" target="_blank" rel="noopener">IMSLP · procurar Bach BWV 846, Czerny Op. 599 e outras peças</a></p><p style="margin:9px 0"><a href="https://www.hanon-online.com/" target="_blank" rel="noopener">Hanon · exercícios</a></p><p class="notice">Use sua própria edição da partitura para confirmar compassos, ornamentos e dedilhados. As partituras não estão incorporadas nesta versão.</p></div><div class="card"><h3>Seus dados</h3><p class="notice">O histórico é salvo neste navegador, quando permitido. Não há conta ou sincronização. Faça backup, especialmente se abrir o arquivo localmente ou trocar de dispositivo.</p><div class="row" style="margin-top:12px"><button data-action="export">Exportar backup</button><button data-action="import">Importar backup</button><button class="ghost danger" data-action="reset">Reiniciar</button></div></div>`}
function render(){document.body.classList.toggle('dark',state.prefs.dark);renderNav();const main=document.getElementById('main');main.innerHTML=`<div class="top"><div class="eyebrow">CLAVIER / ESTÚDIO PESSOAL</div><button class="ghost" data-action="theme" aria-label="Alternar tema">${state.prefs.dark?'☀':'☾'}</button></div>`+({today:renderToday,plan:renderPlan,progress:renderProgress,settings:renderSettings}[view]());}
function formatTimer(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}function drawTimer(){let e=document.getElementById('timerDisplay');if(e)e.textContent=formatTimer(remaining)}function stopTimer(){clearInterval(practiceTimer);practiceTimer=null;activeTimer=null;remaining=0}function startTimer(id,min){if(activeTimer===id){stopTimer();render();return}stopTimer();activeTimer=id;remaining=min*60;const end=Date.now()+remaining*1000;practiceTimer=setInterval(()=>{remaining=Math.max(0,Math.ceil((end-Date.now())/1000));drawTimer();if(remaining===0){stopTimer();render();toast('Tempo do exercício concluído. Avalie a execução.')}},250);render()}
function stopMetro(){metroOn=false;clearInterval(metroTimer);metroTimer=null;try{audioCtx?.suspend()}catch(e){}const b=document.getElementById('metroToggle');if(b)b.textContent='Iniciar'}async function startMetro(n){bpm=Math.min(180,Math.max(30,Number(n)||60));if(metroOn)stopMetro();try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();metroOn=true;nextTick=audioCtx.currentTime+.04;const scheduler=()=>{while(nextTick<audioCtx.currentTime+.1){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=1000;g.gain.setValueAtTime(.0001,nextTick);g.gain.exponentialRampToValueAtTime(.12,nextTick+.004);g.gain.exponentialRampToValueAtTime(.0001,nextTick+.045);o.connect(g);g.connect(audioCtx.destination);o.start(nextTick);o.stop(nextTick+.05);nextTick+=60/bpm}};scheduler();metroTimer=setInterval(scheduler,25);render()}catch(e){metroOn=false;toast('Áudio não disponível neste navegador. Use o metrônomo do piano.')}}
function finish(){let p=plan()[0];if(p.date>daykey()){toast('Este treino está planejado para uma data futura.');return}let count=doneCount(p.tasks);if(!count)return;if(count<p.tasks.length&&!confirm('Marcar os exercícios sem avaliação como “Não fiz” e finalizar?'))return;const h={date:p.date,n:p.n,minutes:p.minutes,note:state.note||'',before:copy(state.skills),tasks:p.tasks.map(t=>{let d=getDraft(t.id);return {...t,score:Number.isInteger(d.score)?d.score:0,issue:d.issue||'',actualBpm:Number(d.bpm)||null}}),beforeChanges:copy(state.lastChanges||[])};let changes=[];for(const t of h.tasks)if(ids.includes(t.id))changes.push(update(state.skills,t.id,t.score,t.issue,t.actualBpm));state.history.push(h);state.lastChanges=changes;state.draft={};state.note='';sessionDate=null;tempMinutes=null;stopTimer();stopMetro();save();view='plan';render();window.scrollTo(0,0);toast('Treino registrado. Os próximos 15 foram recalculados.')}
function undo(){if(!state.history.length||!confirm('Desfazer a última sessão e restaurar o progresso anterior?'))return;const h=state.history.pop();state.skills=h.before;state.lastChanges=h.beforeChanges||[];state.draft=Object.fromEntries(h.tasks.filter(t=>!h.legacy||!isPiece(t.id)).map(t=>[t.id,{score:t.score,issue:t.issue,bpm:t.actualBpm}]));state.note=h.note;sessionDate=h.date===daykey()?h.date:null;tempMinutes=h.minutes;save();view='today';render();window.scrollTo(0,0);toast('Última sessão desfeita.')}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='clavier-backup-'+daykey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav){view=d.nav;render();window.scrollTo(0,0);return}if(d.score!==undefined){setDraft(d.id,{score:Number(d.score),issue:Number(d.score)===1?getDraft(d.id).issue:''});render();return}if(d.metro){startMetro(d.metro);return}if(d.timer){startTimer(d.timer,Number(d.min));return}if(d.day!==undefined){let n=Number(d.day),a=state.prefs.days;if(a.includes(n)&&a.length===1){toast('Escolha ao menos um dia.');return}state.prefs.days=a.includes(n)?a.filter(x=>x!==n):[...a,n];save();render();return}switch(d.action){case 'finish':finish();break;case 'train-now':sessionDate=daykey();save();render();break;case 'theme':state.prefs.dark=!state.prefs.dark;save();render();break;case 'metro-toggle':if(metroOn){stopMetro();render()}else startMetro(document.getElementById('metroBpm').value);break;case 'timer-stop':stopTimer();render();break;case 'undo':undo();break;case 'export':backup();break;case 'import':document.getElementById('importFile').click();break;case 'reset':if(confirm('Apagar todo o histórico local? Exporte um backup antes.')){stopMetro();stopTimer();state=fresh();sessionDate=null;tempMinutes=null;save();render()}break}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='sessionNote'){state.note=el.value;save()}if(el.dataset.bpm){setDraft(el.dataset.bpm,{bpm:el.value?Math.max(30,Math.min(180,Number(el.value))):null})}});document.addEventListener('change',e=>{const el=e.target;if(el.dataset.issue)setDraft(el.dataset.issue,{issue:el.value});if(el.id==='sessionMins'){tempMinutes=Number(el.value);save();render()}if(el.id==='prefMins'){state.prefs.minutes=Number(el.value);tempMinutes=null;save();render()}if(el.id==='metroBpm'){bpm=Math.max(30,Math.min(180,Number(el.value)||60));if(metroOn)startMetro(bpm)} });
document.getElementById('importFile').addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;const s=migrate(JSON.parse(await file.text()));if(!valid(s))throw Error('Formato inválido');if(confirm('Substituir os dados locais pelo backup?')){stopMetro();stopTimer();state=s;tempMinutes=s.draftMinutes||null;sessionDate=s.draftDate||null;save();render();toast('Backup importado.')}}catch(err){toast('Backup inválido ou não reconhecido.')}e.target.value=''});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
